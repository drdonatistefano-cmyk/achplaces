<style>
:root{--bg:#0E1A33;--bg1:#16284D;--ink:#EAF1FF;--mut:rgba(214,225,248,.72);--fa:rgba(214,225,248,.5);--ln:rgba(170,200,255,.2);--ac:#5EEAD4;--ac2:#FFB86B;--panel:#14223F;--chip:rgba(255,255,255,.05)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none;position:fixed;inset:0;width:100%;-webkit-text-size-adjust:100%;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
#app{position:fixed;inset:0;display:flex;overflow:hidden;background:radial-gradient(120% 90% at 42% 28%,var(--bg1) 0%,var(--bg) 70%);transition:background .4s}
.gl{background:var(--panel);border:1px solid var(--ln);box-shadow:0 24px 70px rgba(0,0,0,.5)}
.cap{font-size:11px;letter-spacing:.15em;text-transform:uppercase;color:var(--fa)}
.sg{font-family:'Space Grotesk',Inter,sans-serif}
/* mappa */
#map{position:relative;flex:1;min-width:0;touch-action:none;cursor:grab}
#map.drag{cursor:grabbing}
#layer{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform}#cv{display:block}
.reg{fill:#0E1730;stroke:rgba(150,180,255,.45);stroke-width:1.1;vector-effect:non-scaling-stroke;transition:fill .3s}
.reg.hl{fill:#132447}
.prv{fill:none;stroke:rgba(150,180,255,.17);stroke-width:.7;vector-effect:non-scaling-stroke;transition:opacity .4s}
.bub{cursor:pointer}
.bub .h{fill:url(#alone)}
.bub .c{fill:rgba(94,234,212,.15);stroke:var(--ac);stroke-width:1.4;transition:fill .2s}
.bub:hover .c{fill:rgba(94,234,212,.32)}
.bub.sel .c{stroke:var(--ac2);stroke-width:2.4;fill:rgba(255,184,107,.22)}
.bub .n{font:600 12px 'Space Grotesk',sans-serif;fill:#F2F7FF;text-anchor:middle;dominant-baseline:central;pointer-events:none}
.bub .l{font:500 11px Inter,sans-serif;fill:rgba(225,233,255,.82);text-anchor:middle;pointer-events:none;paint-order:stroke;stroke:rgba(5,8,15,.85);stroke-width:3px}
.fade{animation:fd .35s ease}@keyframes fd{from{opacity:0}to{opacity:1}}
@media (prefers-reduced-motion:reduce){.fade{animation:none}.reg{transition:none}}
/* barra in alto sulla mappa */
#top{position:absolute;top:calc(14px + env(safe-area-inset-top));left:14px;right:14px;display:flex;gap:10px;align-items:center;pointer-events:none}
#top>*{pointer-events:auto}
#crumb{display:flex;align-items:center;gap:6px;padding:7px 8px 7px 14px;border-radius:16px;min-width:0;max-width:520px}
#crumb .t{min-width:0}#crumb .t div:last-child{font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#fbtn{display:inline-flex;align-items:center;gap:8px;height:42px;padding:0 14px 0 12px;border-radius:12px;border:1px solid rgba(94,234,212,.45);background:rgba(94,234,212,.09);color:#A7F3E8;font-size:14px;font-weight:600;flex:none}
#fbtn b{display:none;min-width:20px;height:20px;border-radius:10px;background:var(--ac);color:#03201C;font-size:11.5px;place-items:center;padding:0 6px}
#fbtn b.on{display:inline-grid}
.crumbbtn{border:0;background:none;padding:0;color:var(--ac);font-weight:600}
#zoom{position:absolute;right:14px;top:calc(76px + env(safe-area-inset-top));display:flex;flex-direction:column;gap:2px;padding:4px;border-radius:18px}
.zm{width:44px;height:44px;border:0;border-radius:14px;background:none;display:grid;place-items:center}
.zm:hover{background:rgba(255,255,255,.07)}
#toast{position:absolute;left:50%;top:18px;transform:translateX(-50%);z-index:30;max-width:86%;padding:9px 16px;border-radius:999px;background:var(--panel,#fff);color:var(--ink,#111);border:1px solid var(--ln);box-shadow:0 6px 20px rgba(0,0,0,.14);font-size:13.5px;text-align:center;transition:opacity .3s;pointer-events:none}#toast.off{opacity:0}@media (max-width:699.98px){#toast{top:118px}}#gps.busy svg{animation:gp 1s linear infinite}@keyframes gp{to{transform:rotate(360deg)}}
#hint{position:absolute;left:50%;bottom:22px;transform:translateX(-50%);font-size:12.5px;color:var(--mut);white-space:nowrap;padding:8px 14px;border-radius:999px;pointer-events:none;transition:opacity .4s}
#levels{display:flex;gap:2px;margin-left:6px;padding-left:10px;border-left:1px solid var(--ln)}
#levels span{font-size:12px;padding:6px 9px;border-radius:10px;color:var(--fa);white-space:nowrap}
#levels span.on{background:rgba(94,234,212,.14);color:#A7F3E8}
/* pannello filtri */
#filt{position:absolute;z-index:6;display:flex;flex-direction:column;gap:20px;padding:20px;border-radius:24px;overflow:auto;transition:transform .35s cubic-bezier(.2,.8,.2,1),opacity .25s}
#filt.off{opacity:0;pointer-events:none}
.fh{display:flex;align-items:center;justify-content:space-between}
.srch{display:flex;align-items:center;gap:10px;height:48px;padding:0 14px;border-radius:14px;border:1px solid var(--ln);background:var(--chip)}
.srch input{flex:1;min-width:0;height:100%;border:0;outline:0;background:none;color:var(--ink);font:16px Inter,sans-serif}
.srch input::placeholder{color:var(--fa)}
.cats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.cat{display:grid;grid-template-columns:auto 1fr;grid-template-rows:auto auto;column-gap:10px;align-content:center;height:56px;padding:0 12px;border-radius:14px;border:1px solid var(--ln);background:var(--chip);font-size:14px;text-align:left}
.cat i{width:10px;height:10px;border-radius:50%;grid-row:1/3;align-self:center}
.cat span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}.cat small{grid-column:2}
.cat small,.chip small{color:var(--fa);font-size:11.5px;font-variant-numeric:tabular-nums}
.cat.on{border-color:var(--c);background:color-mix(in srgb,var(--c) 15%,transparent)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:7px;height:38px;padding:0 13px;border-radius:999px;border:1px solid var(--ln);background:var(--chip);font-size:13.5px;white-space:nowrap}
.chip.on{border-color:var(--ac);background:rgba(94,234,212,.14);color:#E8FFFB}
.chip.on small{color:#CFFAF3}
.fbar{display:flex;gap:10px;margin-top:auto;position:sticky;bottom:-20px;padding:10px 0 20px;margin-bottom:-20px;background:var(--panel)}
.b1{flex:1;height:50px;border-radius:14px;border:1px solid var(--ln);background:var(--panel);font-size:14.5px}
.b2{flex:2;height:50px;border-radius:14px;border:0;background:var(--ac);color:#03201C;font-size:14.5px;font-weight:650}
#veil{position:absolute;inset:0;background:rgba(3,6,12,.5);z-index:5;transition:opacity .3s}
#veil.off{opacity:0;pointer-events:none}
/* lista */
#list{position:relative;z-index:4;display:flex;flex-direction:column;gap:14px;padding:22px 16px 10px}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding:0 6px}
#nv{font:600 38px/1 'Space Grotesk',sans-serif;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
#nvl{margin-top:6px;font-size:13px;color:var(--mut)}
#nvr{font-size:12px;color:var(--fa);text-align:right}
#items{flex:1;min-height:0;overflow:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;touch-action:pan-y;margin:0 -6px;padding:0 2px 20px;scrollbar-width:thin;scrollbar-color:rgba(160,190,255,.25) transparent}
.row{content-visibility:auto;contain-intrinsic-size:auto 104px;border-radius:16px;padding:2px 0 10px;margin:0 2px 10px;border:1.5px solid color-mix(in srgb,var(--g) 45%,var(--ln));background:var(--chip)}
html[data-t=carta] .row{background:#fff;border-color:color-mix(in srgb,var(--g) 40%,#6F6254);box-shadow:0 1px 2px rgba(60,40,20,.06),0 4px 14px rgba(60,40,20,.06)}
.it{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;padding:12px 12px 8px;border:0;border-radius:16px;background:none}
.rb{display:flex;gap:6px;padding:0 12px 0 68px;flex-wrap:wrap}
.rb a,.rb button{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 12px;border-radius:10px;border:1px solid var(--ln);background:rgba(255,255,255,.04);color:var(--ink);font-size:13px;font-weight:600;text-decoration:none}
.rb .tk{background:rgba(94,234,212,.12);border-color:rgba(94,234,212,.45);color:#BFF7EE}
.rb .fr{background:rgba(134,221,160,.12);border-color:rgba(134,221,160,.45);color:#C8F2D3}
.rb svg{width:15px;height:15px}
.it:hover{background:rgba(255,255,255,.045)}
.ib{width:44px;height:44px;flex:none;border-radius:13px;display:grid;place-items:center;border:1px solid var(--ln);background:var(--chip)}
.ib i{width:12px;height:12px;border-radius:50%}
.it b{display:block;font-size:14.5px;font-weight:600;line-height:1.28}
.it .d{display:block;margin-top:3px;font-size:12.5px;color:var(--mut)}
.it .tg{display:flex;flex-wrap:wrap;gap:6px;margin-top:7px}
.it .tg span{font-size:11px;padding:2px 8px;border-radius:999px;border:1px solid var(--ln);color:var(--mut)}
.empty{padding:30px 14px;color:var(--mut);font-size:14px;line-height:1.55}
.grab,.grabz{display:none}
.note{font-size:11px;line-height:1.5;color:var(--fa)}
/* computer: filtri a sinistra, lista a destra */
@media (min-width:1280px){
  #filt{position:relative;width:310px;flex:none;margin:16px 0 16px 16px;transform:none}
  #filt.off{display:none}
  #list{width:384px;flex:none;margin:16px;border-radius:24px}
  #veil{display:none}
  #filt .fbar .b2{display:none}
  #fbtn.hideDesk{display:none}
}
/* iPad e computer piccolo: lista a destra, filtri a scomparsa sopra la mappa */
@media (min-width:700px) and (max-width:1279.98px){
  #list{width:360px;flex:none;margin:14px;border-radius:24px}
  #filt{left:14px;top:calc(70px + env(safe-area-inset-top));width:390px;max-height:calc(100% - 90px)}
  #filt.off{transform:translateY(-10px)}
}
/* telefono: mappa sopra, lista che sale dal basso */
@media (max-width:699.98px){
  #app{flex-direction:column}
  #map{flex:none;height:56%}
  #list{position:absolute;left:0;right:0;bottom:0;top:calc(10% + env(safe-area-inset-top));border-radius:28px 28px 0 0;background:var(--panel);padding:6px 14px 0;will-change:transform}
  #list.anim{transition:transform .38s cubic-bezier(.2,.8,.2,1)}
  .grab{display:block;width:44px;height:5px;border-radius:3px;background:rgba(210,220,245,.35);margin:6px auto 4px}
  .grabz{display:flex!important;justify-content:center;padding:6px 0 4px;border:0;background:none;width:100%;touch-action:none}
  #list .head{touch-action:none;padding-bottom:6px}
  #nv{font-size:30px}
  #filt{left:0;right:0;bottom:0;max-height:86%;border-radius:28px 28px 0 0;padding:18px 16px calc(16px + env(safe-area-inset-bottom))}
  #filt.off{transform:translateY(40px)}
  #zoom{top:auto;bottom:calc(44% + 30px)}
  #hint{display:none}
  #levels span:not(.on){display:none}
  #crumb{flex:1}
}

/* scheda del luogo */
#sheet{position:fixed;z-index:20;display:flex;flex-direction:column;gap:16px;padding:22px;border-radius:28px;overflow:auto;transition:transform .42s cubic-bezier(.2,.8,.2,1),opacity .3s}
#sheet.off{opacity:0;pointer-events:none;transform:translateY(24px) scale(.98)}
#sheetveil{position:fixed;inset:0;z-index:19;background:rgba(3,6,12,.55);transition:opacity .3s}
#sheetveil.off{opacity:0;pointer-events:none}
.sk{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.sk .pill{font-size:12px;padding:4px 10px;border-radius:999px;border:1px solid var(--ln);color:rgba(225,233,255,.85)}
#sheet h2{margin:0;font:600 26px/1.15 'Space Grotesk',sans-serif;letter-spacing:-.01em}
#sheet .dove{font-size:14px;color:var(--mut);margin-top:6px}
#sheet .txt{font-size:15px;line-height:1.6;color:#DCE5FA;margin:0}
#sheet .why{border-left:0;padding:14px 16px;border-radius:16px;background:rgba(94,234,212,.07);border:1px solid rgba(94,234,212,.22);font-size:14px;line-height:1.55}
#sheet dl{display:grid;grid-template-columns:auto 1fr;gap:10px 16px;margin:0;font-size:14px}
#sheet dt{color:var(--fa)}#sheet dd{margin:0}
