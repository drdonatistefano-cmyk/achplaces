name: Prova OSRM
on: { workflow_dispatch: }
jobs:
  prova:
    runs-on: ubuntu-latest
    steps:
      - run: |
          U="https://router.project-osrm.org"
          P="8.55108,45.92145;8.61707,45.95635;8.6200,45.9030;8.4500,45.8900"
          echo "--- table con exclude"; curl -s -m 30 "$U/table/v1/driving/$P?sources=0&annotations=distance&exclude=ferry" | head -c 600; echo
          echo "--- table normale"; curl -s -m 30 "$U/table/v1/driving/$P?sources=0&annotations=distance" | head -c 600; echo
          echo "--- route Verbania-Laveno con passi"; curl -s -m 30 "$U/route/v1/driving/8.55108,45.92145;8.6200,45.9030?steps=true&overview=false" | python3 -c "import json,sys;d=json.load(sys.stdin);r=d['routes'][0];print(r['distance']);print(set(s['mode'] for l in r['legs'] for s in l['steps']))"
