name: Comuni vicini su strada (OSRM)
# 17/11/2026: distanze su strada senza traghetti per «Comuni vicini» (segnalazione del Comune di Verbania). A mano.
# 4 parti in parallelo; ogni parte salva e fa push ogni 150 comuni e riprende da dove era arrivata.
on: { workflow_dispatch: }
permissions: { contents: write }
jobs:
  vicini:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy: { fail-fast: false, matrix: { parte: [0, 1, 2, 3] } }
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 1 }
      - run: |
          git config user.name "achplaces-bot"; git config user.email "actions@users.noreply.github.com"
          python3 sorgenti/vicini_strada.py
        env: { PARTE: '${{ matrix.parte }}', PARTI: '4', SALVA_GIT: '1' }
