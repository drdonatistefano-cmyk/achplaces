name: Biglietti e ingressi gratuiti dalle pagine ufficiali (5 lavori)
# 10/11/2026 sera: link alla biglietteria o ingresso gratuito, letti dalle pagine ufficiali gia citate, per i luoghi senza link.
# Ognuno dei cinque lavori salva out/biglietti-<gruppo>.json sul ramo «foto». Gira il lunedì o a mano. Gratuito.
on:
  schedule:
    - cron: '23 6 * * 1'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  biglietti:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix: { gruppo: [0, 1, 2, 3, 4] }
    steps:
      - uses: actions/checkout@v4
        with: { sparse-checkout: "sorgenti/biglietti\n.github", fetch-depth: 1 }
      - name: Ramo foto
        run: |
          git fetch origin foto
          git worktree add -B foto out origin/foto
          cd out && git sparse-checkout disable || true
          git config user.name "achplaces-bot"; git config user.email "actions@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install requests pillow
      - name: Leggi le pagine ufficiali
        run: python sorgenti/biglietti/actions_biglietti.py ${{ matrix.gruppo }}
      - name: Salva
        run: |
          cd out
          git add biglietti-${{ matrix.gruppo }}.json
          git commit -q -m "Biglietti, gruppo ${{ matrix.gruppo }}" || exit 0
          for i in 1 2 3 4 5 6; do git pull --rebase -q origin foto && git push -q origin HEAD:foto && exit 0; sleep $((RANDOM % 15 + 5)); done
          exit 1
