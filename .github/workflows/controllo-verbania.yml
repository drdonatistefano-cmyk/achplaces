name: Controllo online Verbania
on: { workflow_dispatch: }
jobs:
  c:
    runs-on: ubuntu-latest
    steps:
      - run: |
          B=https://achplaces.com
          curl -s "$B/comune/verbania-vb/" -o p.html; echo "pagina illago: $(grep -c illagomaggiore p.html) viviverbania: $(grep -o viviverbania p.html | wc -l) parcovalgrande: $(grep -o parcovalgrande p.html | wc -l)"
          curl -s "$B/manifest.json" | grep -o 'det.vb.[0-9a-f]*.json'
          F=$(curl -s "$B/manifest.json" | grep -o 'det.vb.[0-9a-f]*.json'); curl -s "$B/$F" | grep -o 'illagomaggiore' | wc -l
          curl -s -o /dev/null -w "vicini.json %{http_code} %{size_download}\n" "$B/vicini.json"
          curl -s "$B/" | grep -c 'function vicini(C)'
