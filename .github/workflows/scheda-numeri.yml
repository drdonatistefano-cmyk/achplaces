name: Numeri della Scheda (ricette e prodotti da Ach's Dishes)
# 24/11/2026, Stefano («sistema tutto»): i numeri della «Scheda» di comuni, province, zone e regioni si leggono ogni
# notte da Ach's Dishes (sorgenti/scheda/numeri.py apre Dishes in un browser senza schermo e legge gli stessi numeri
# che vede chi clicca), così coincidono sempre. Gratis (repository pubblico, ~2 minuti). Se scheda.json non cambia,
# nessun commit. La pubblicazione la fa partire il Guardiano (i commit col GITHUB_TOKEN non avviano «Pubblica»).
on:
  workflow_dispatch:
  schedule: [{ cron: "41 3 * * *" }]
permissions:
  contents: write
concurrency: { group: scheda-numeri, cancel-in-progress: false }
jobs:
  numeri:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: { sparse-checkout: "sorgenti/scheda", sparse-checkout-cone-mode: false, fetch-depth: 1 }
      - name: Ach's Dishes (repository pubblico)
        run: git clone -q --depth 1 https://github.com/drdonatistefano-cmyk/achdishes /tmp/achdishes
      - name: Browser senza schermo
        run: pip install -q playwright && python3 -m playwright install --with-deps chromium >/dev/null
      - name: Numeri
        run: |
          git sparse-checkout add scheda.json
          python3 sorgenti/scheda/numeri.py /tmp/achdishes
      - name: Salva se sono cambiati
        run: |
          git config user.name "achplaces-bot"; git config user.email "actions@users.noreply.github.com"
          git add scheda.json
          git diff --cached --quiet && { echo "numeri uguali a ieri"; exit 0; }
          git commit -q -m "Scheda: numeri di ricette e prodotti aggiornati da Ach's Dishes $(date +%F)"
          for i in 1 2 3; do git pull -q --rebase origin main && git push -q origin HEAD:main && exit 0; sleep 10; done; exit 1
