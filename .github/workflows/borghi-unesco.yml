name: Link Borghi e UNESCO
# 15/11/2026: raccoglie gli indirizzi delle pagine ufficiali dei Borghi più belli d'Italia e dei beni UNESCO
# (sorgenti/link/borghi_unesco.py) e li salva nel ramo «collegamenti». A mano o ogni mese.
on:
  workflow_dispatch:
  schedule: [{ cron: "17 4 3 * *" }]
  push:
    branches: [main]
    paths: ['sorgenti/link/borghi_unesco.py', '.github/workflows/borghi-unesco.yml']
permissions:
  contents: write
jobs:
  link:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: { sparse-checkout: "sorgenti/link", fetch-depth: 1 }
      - run: echo ok
      - run: python3 sorgenti/link/borghi_unesco.py out
      - name: Salva nel ramo collegamenti
        run: |
          git config user.name "achplaces-bot"; git config user.email "actions@users.noreply.github.com"
          mv out /tmp/out
          git fetch -q origin collegamenti && git checkout -q -B collegamenti origin/collegamenti || git checkout -q --orphan collegamenti
          git rm -rfq . 2>/dev/null || true
          cp /tmp/out/*.json .
          git add borghi.json unesco.json
          git commit -q -m "Link Borghi e UNESCO $(date +%F)" || exit 0
          git push -q origin HEAD:collegamenti
